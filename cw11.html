<!DOCTYPE html>
<meta charset="UTF-8">
<html>
<head>
<title>WebGL Roje świetlików</title>
<style>
    html, body {
        margin: 0;          /* brak marginesu wokół płótna */
        overflow: hidden;   /* brak pasków przewijania */
    }
    canvas {
        display: block;     /* usuwa drobny margines pod canvasem */
    }
</style>

<!--
    Dwuwymiarowa aplikacja WebGL, w której "punkty" (rój świetlików) poruszają
    się po oknie przeglądarki, odbijając się od krawędzi. Animację można
    wstrzymać i wznowić klawiszem spacji.
        Klik lub klik-i-przeciągnięcie myszą kieruje wszystkie punkty w stronę
    kursora; klik z wciśniętym Shift ponownie inicjalizuje pozycje i prędkości
    (punkty startują ze środka).

    ----------------------------------------------------------------------------
    INTERFEJS KLAWIATURY (obsługiwany w funkcji doKey()):
        Spacja .... wstrzymaj / wznów animację
        K / k ..... przełącz losowe kolory <-> jednolity bursztynowy
        1 ......... styl: pełny kwadrat
        2 ......... styl: dysk (koło)
        3 ......... styl: pierścień (świecąca obwódka)
        4 ......... styl: sześciokąt z zanikaniem alfa (od środka do krawędzi)
        5 ......... styl: czteroramienna gwiazda z poświatą
    ----------------------------------------------------------------------------
-->

<script type="x-shader/x-vertex" id="vshader-source">
    attribute vec2 a_coords;
    attribute vec3 a_color;
    uniform float u_width;
    uniform float u_height;
    uniform float u_pointSize;
    varying vec3 v_color;
    void main() {
        float x = a_coords.x / u_width  * 2.0 - 1.0;
        float y = 1.0 - a_coords.y / u_height * 2.0;
        gl_Position  = vec4(x, y, 0.0, 1.0);
        gl_PointSize = u_pointSize;
        v_color = a_color;
    }
</script>

<script type="x-shader/x-fragment" id="fshader-source">
    #ifdef GL_FRAGMENT_PRECISION_HIGH
       precision highp float;
    #else
       precision mediump float;
    #endif
    varying vec3 v_color;
    uniform int u_style;

    // Odległość kątowa potrzebna do sześciokąta i gwiazdy.
    void main() {
        vec2 p = gl_PointCoord - vec2(0.5);
        float r = length(p);
        float ang = atan(p.y, p.x);

        if (u_style == 0) {
            // pełny kwadrat
            gl_FragColor = vec4(v_color, 1.0);

        } else if (u_style == 1) {
            // dysk (koło)
            if (r > 0.5) discard;
            gl_FragColor = vec4(v_color, 1.0);

        } else if (u_style == 2) {
            // pierścień: świecąca obwódka, środek przezroczysty
            if (r > 0.5 || r < 0.32) discard;
            float alpha = 1.0 - abs(r - 0.41) / 0.09;
            gl_FragColor = vec4(v_color, alpha);

        } else if (u_style == 3) {
            // sześciokąt foremny z zanikaniem alfa od środka do krawędzi
            // promień sześciokąta jako funkcja kąta:
            float a = mod(ang, 1.04719755) - 0.52359877;  // 60 stopni
            float hexDist = r * cos(a);
            if (hexDist > 0.45) discard;
            float alpha = 1.0 - hexDist / 0.45;
            gl_FragColor = vec4(v_color, alpha);

        } else {
            // czteroramienna gwiazda z miękką poświatą
            float star = 0.30 + 0.18 * abs(cos(2.0 * ang));
            if (r > star) discard;
            float alpha = 1.0 - r / star;
            alpha = alpha * alpha;  // ostrzejsza poświata w środku
            gl_FragColor = vec4(v_color, alpha);
        }
    }
</script>

<script>

"use strict";

var canvas;
var gl;

var u_width_loc;
var u_height_loc;
var u_style_loc;
var u_pointSize_loc;
var a_coords_loc;
var a_color_loc;

var a_coords_buffer;
var a_color_buffer;

var POINT_COUNT = 70;          // gęstszy rój niż w oryginale
var POINT_SIZE  = 48;          // mniejsze, lżejsze punkty

var positions  = new Float32Array(2 * POINT_COUNT);
var velocities = new Float32Array(2 * POINT_COUNT);
var colors     = new Float32Array(3 * POINT_COUNT);

var isRunning         = true;
var usePerVertexColor = true;
var currentStyle      = 4;     // start od najbardziej efektownej gwiazdy


/**
 * Wywoływana z frame() dla każdej klatki animacji — rysuje punkty.
 */
function render() {
    gl.clear(gl.COLOR_BUFFER_BIT);

    // Co klatkę wysyłamy zaktualizowane pozycje.
    gl.bindBuffer(gl.ARRAY_BUFFER, a_coords_buffer);
    gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STREAM_DRAW);
    gl.vertexAttribPointer(a_coords_loc, 2, gl.FLOAT, false, 0, 0);

    gl.uniform1i(u_style_loc, currentStyle);

    gl.drawArrays(gl.POINTS, 0, POINT_COUNT);
}


/**
 * Inicjalizuje pozycje punktów w środku płótna z losowymi prędkościami.
 * Prędkość rozłożona równomiernie w [1.5, 5.5] piksela/klatkę.
 */
function createData() {
    for (var i = 0; i < POINT_COUNT; i++) {
        positions[2*i]   = canvas.width  / 2;
        positions[2*i+1] = canvas.height / 2;
        var speed = 1.5 + 4 * Math.random();
        var angle = 2 * Math.PI * Math.random();
        velocities[2*i]   = speed * Math.sin(angle);
        velocities[2*i+1] = speed * Math.cos(angle);
    }
}


/**
 * Przesuwa pozycje o jedną klatkę i odbija punkty od krawędzi płótna.
 */
function updateData() {
    for (var i = 0; i < POINT_COUNT; i++) {
        positions[2*i] += velocities[2*i];
        if (positions[2*i] < POINT_SIZE / 2 && velocities[2*i] < 0) {
            positions[2*i] += 2 * (POINT_SIZE / 2 - positions[2*i]);
            velocities[2*i] = Math.abs(velocities[2*i]);
        } else if (positions[2*i] > canvas.width - POINT_SIZE / 2 && velocities[2*i] > 0) {
            positions[2*i] -= 2 * (positions[2*i] - canvas.width + POINT_SIZE / 2);
            velocities[2*i] = -Math.abs(velocities[2*i]);
        }

        positions[2*i+1] += velocities[2*i+1];
        if (positions[2*i+1] < POINT_SIZE / 2 && velocities[2*i+1] < 0) {
            positions[2*i+1] += 2 * (POINT_SIZE / 2 - positions[2*i+1]);
            velocities[2*i+1] = Math.abs(velocities[2*i+1]);
        } else if (positions[2*i+1] > canvas.height - POINT_SIZE / 2 && velocities[2*i+1] > 0) {
            positions[2*i+1] -= 2 * (positions[2*i+1] - canvas.height + POINT_SIZE / 2);
            velocities[2*i+1] = -Math.abs(velocities[2*i+1]);
        }
    }
}


/**
 * Wypełnia tablicę kolorów ciepłą paletą (bursztyn / zieleń świetlika).
 * Odcienie losowane wokół zieleni i żółci, aby rój wyglądał spójnie.
 */
function fillFireflyColors() {
    for (var i = 0; i < POINT_COUNT; i++) {
        var t = Math.random();
        // mieszanka od ciepłej żółci (1.0, 0.9, 0.2) do limonki (0.4, 1.0, 0.3)
        colors[3*i]   = 0.4 + 0.6 * t;
        colors[3*i+1] = 0.85 + 0.15 * Math.random();
        colors[3*i+2] = 0.15 + 0.25 * (1.0 - t);
    }
}


/**
 * Obsługa klawiatury.
 * Kody klawiszy: 32=Spacja, 75=K/k, 49..53 = klawisze 1..5
 */
function doKey(evt) {
    var key = evt.keyCode;

    if (key === 32) {           // Spacja — wstrzymaj / wznów
        isRunning = !isRunning;
        if (isRunning) {
            requestAnimationFrame(frame);
        }
    } else if (key === 75) {    // K / k — przełącz losowe kolory <-> bursztyn
        usePerVertexColor = !usePerVertexColor;
        if (usePerVertexColor) {
            gl.bindBuffer(gl.ARRAY_BUFFER, a_color_buffer);
            gl.enableVertexAttribArray(a_color_loc);
            gl.vertexAttribPointer(a_color_loc, 3, gl.FLOAT, false, 0, 0);
        } else {
            gl.disableVertexAttribArray(a_color_loc);
            gl.vertexAttrib3f(a_color_loc, 1.0, 0.78, 0.25);  // jednolity bursztyn
        }
    } else if (key === 49) {    // 1 — kwadrat
        currentStyle = 0;
    } else if (key === 50) {    // 2 — dysk
        currentStyle = 1;
    } else if (key === 51) {    // 3 — pierścień
        currentStyle = 2;
    } else if (key === 52) {    // 4 — sześciokąt z zanikaniem
        currentStyle = 3;
    } else if (key === 53) {    // 5 — gwiazda z poświatą
        currentStyle = 4;
    }

    if (!isRunning) {
        render();   // odśwież obraz, gdy animacja jest zatrzymana
    }
}


/**
 * Konfiguruje program WebGL, bufory i stan początkowy.
 */
function initGL() {
    var prog = createProgram(gl, "vshader-source", "fshader-source", "a_coords");
    gl.useProgram(prog);

    u_width_loc     = gl.getUniformLocation(prog, "u_width");
    u_height_loc    = gl.getUniformLocation(prog, "u_height");
    u_style_loc     = gl.getUniformLocation(prog, "u_style");
    u_pointSize_loc = gl.getUniformLocation(prog, "u_pointSize");
    a_coords_loc    = gl.getAttribLocation(prog, "a_coords");
    a_color_loc     = gl.getAttribLocation(prog, "a_color");

    gl.uniform1f(u_width_loc,     canvas.width);
    gl.uniform1f(u_height_loc,    canvas.height);
    gl.uniform1i(u_style_loc,     currentStyle);
    gl.uniform1f(u_pointSize_loc, POINT_SIZE);

    // Bufor współrzędnych — co klatkę przeładowywany (STREAM_DRAW).
    a_coords_buffer = gl.createBuffer();
    gl.enableVertexAttribArray(a_coords_loc);

    // Bufor kolorów — ciepła paleta świetlików, wysyłany raz.
    fillFireflyColors();
    a_color_buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, a_color_buffer);
    gl.bufferData(gl.ARRAY_BUFFER, colors, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(a_color_loc);
    gl.vertexAttribPointer(a_color_loc, 3, gl.FLOAT, false, 0, 0);

    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.clearColor(0.04, 0.02, 0.10, 1);  // głęboki granatowo-fioletowy zmierzch
}


/**
 * Tworzy i linkuje program WebGL z dwóch elementów-skryptów shadera.
 * Rzuca opisowy łańcuch przy błędzie kompilacji lub linkowania.
 */
function createProgram(gl, vertexShaderID, fragmentShaderID, attribute0) {
    function getTextContent(elementID) {
        var element = document.getElementById(elementID);
        var node = element.firstChild;
        var str = "";
        while (node) {
            if (node.nodeType === 3)
                str += node.textContent;
            node = node.nextSibling;
        }
        return str;
    }
    try {
        var vertexShaderSource   = getTextContent(vertexShaderID);
        var fragmentShaderSource = getTextContent(fragmentShaderID);
    } catch (e) {
        throw "Error: Could not get shader source code from script elements.";
    }
    var vsh = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vsh, vertexShaderSource);
    gl.compileShader(vsh);
    if (!gl.getShaderParameter(vsh, gl.COMPILE_STATUS)) {
        throw "Error in vertex shader:  " + gl.getShaderInfoLog(vsh);
    }
    var fsh = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fsh, fragmentShaderSource);
    gl.compileShader(fsh);
    if (!gl.getShaderParameter(fsh, gl.COMPILE_STATUS)) {
        throw "Error in fragment shader:  " + gl.getShaderInfoLog(fsh);
    }
    var prog = gl.createProgram();
    gl.attachShader(prog, vsh);
    gl.attachShader(prog, fsh);
    if (attribute0) {
        gl.bindAttribLocation(prog, 0, attribute0);
    }
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
        throw "Link error in program:  " + gl.getProgramInfoLog(prog);
    }
    return prog;
}


/**
 * Główna pętla animacji — wywołuje updateData(), render(), po czym ponownie
 * planuje się tak długo, jak isRunning jest true.
 */
function frame() {
    if (isRunning) {
        updateData();
        render();
        requestAnimationFrame(frame);
    }
}


/**
 * Dopasowuje rozmiar płótna do okna i aktualizuje viewport oraz uniformy.
 */
function doResize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform1f(u_width_loc,  canvas.width);
    gl.uniform1f(u_height_loc, canvas.height);
    if (!isRunning) {
        render();
    }
}


/**
 * Obsługa myszy: lewy klik (i przeciąganie) kieruje punkty w stronę kursora.
 * Shift+klik ponownie inicjalizuje wszystkie punkty w środku płótna.
 */
function doMouse(evt) {
    function headTowards(x, y) {
        for (var i = 0; i < POINT_COUNT; i++) {
            var dx   = x - positions[2*i];
            var dy   = y - positions[2*i+1];
            var dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > 0.1) {
                var speed = Math.sqrt(
                    velocities[2*i]   * velocities[2*i] +
                    velocities[2*i+1] * velocities[2*i+1]
                );
                velocities[2*i]   = dx / dist * speed;
                velocities[2*i+1] = dy / dist * speed;
            }
        }
    }
    function move(evt) { headTowards(evt.clientX, evt.clientY); }
    function up()      {
        canvas.removeEventListener("mousemove", move, false);
        document.removeEventListener("mouseup",  up,   false);
    }
    if (evt.which !== 1) return;
    if (evt.shiftKey) {
        createData();
        return;
    }
    headTowards(evt.clientX, evt.clientY);
    canvas.addEventListener("mousemove",   move);
    document.addEventListener("mouseup",   up);
}


/**
 * Obsługa załadowania strony — tworzy płótno, inicjalizuje WebGL i startuje pętlę.
 */
function init() {
    try {
        canvas        = document.createElement("canvas");
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
        gl = canvas.getContext("webgl", { alpha: false, depth: false, stencil: false });
        if (!gl) throw "Browser does not support WebGL";
    } catch (e) {
        document.body.innerHTML =
            "<p>Sorry, could not get a WebGL graphics context.  Error: " + e + "</p>";
        return;
    }
    try {
        createData();
        initGL();
    } catch (e) {
        document.body.innerHTML =
            "<pre>Sorry, could not initialize graphics context.  Error:\n\n" + e + "</pre>";
        return;
    }
    document.body.appendChild(canvas);
    window.addEventListener("resize",  doResize);
    canvas.addEventListener("mousedown", doMouse);
    document.addEventListener("keydown", doKey);
    requestAnimationFrame(frame);
}

</script>
</head>
<body onload="init()">
<noscript>Sorry, this page requires JavaScript.</noscript>
</body>
</html>
